services:
  # ── Postgres + pgvector ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel_rca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_rca"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis (storm suppression / deduplication) ─────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Schema migrations (runs once, then exits) ─────────────────────
  migrate:
    build: .
    command: ["uv", "run", "python", "-m", "src.db.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel_rca

  # ── FastAPI application ───────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Override for container networking (host values come from .env)
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel_rca
      REDIS_URL: redis://redis:6379/0

  # ── Streamlit Ops & Chaos Console ────────────────────────────────
  ui:
    build: .
    command: ["uv", "run", "streamlit", "run", "ui/console.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GITHUB_REPO: ${GITHUB_REPO}

volumes:
  pgdata:
  redisdata:
