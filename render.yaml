services:
  # ── FastAPI backend ────────────────────────────────────────────────
  - type: web
    name: sentinel-rca-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "uv run python -m src.db.migrate && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"
    envVars:
      # prod refuses to start without the Postgres checkpointer (durable HITL approvals).
      - key: ENV
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_DAILY_LIMIT
        value: "30"
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
    healthCheckPath: /health

  # ── Streamlit Ops Console ──────────────────────────────────────────
  - type: web
    name: sentinel-rca-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uv run streamlit run ui/console.py --server.port=8501 --server.address=0.0.0.0
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: sentinel-rca-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEBHOOK_SECRET
        fromService:
          type: web
          name: sentinel-rca-api
          envVarKey: WEBHOOK_SECRET
      - key: GITHUB_REPO
        fromService:
          type: web
          name: sentinel-rca-api
          envVarKey: GITHUB_REPO
