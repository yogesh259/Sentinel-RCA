[project]
name = "sentinel-rca"
version = "0.1.0"
description = "Self-hosted, event-driven Error Root-Cause Analysis engine with MCP, LangGraph, and deterministic guardrails."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]